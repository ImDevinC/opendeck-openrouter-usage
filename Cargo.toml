[package]
name = "oaopenrouter-credits"
version = "0.0.1"
edition = "2021"

[dependencies]
openaction = "2.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.47", features = ["rt-multi-thread", "macros", "time"] }
log = "0.4"
simplelog = "0.12"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
base64 = "0.22"
